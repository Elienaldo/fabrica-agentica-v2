<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Fábrica Agêntica V2</title>
<style>:root{--bg:#0b0d12;--ink:#e5e7eb;--mut:#9ca3af;--todo:#8eb4da;--doing:#fabe3a;--done:#3ed39b}
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--ink);min-height:100vh}
header{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:18px 24px;background:#11141b;border-bottom:1px solid #262c38}
h1{font-size:20px;margin:0;flex:1;color:#f3f4f6}h1 small{color:var(--mut);font-weight:400;font-size:13px;margin-left:8px}
button{border:1px solid #333b4a;border-radius:8px;padding:8px 12px;font:inherit;font-size:13px;cursor:pointer;background:#1a1f2a;color:var(--ink)}
button.pri{background:#3d6ea3;border-color:#3d6ea3;color:#fff}button:hover{filter:brightness(1.15)}
.board{display:grid;grid-template-columns:repeat(3,minmax(260px,1fr));gap:18px;padding:22px 24px}
.col{background:var(--colbg);border:1px solid rgba(255,255,255,.08);border-radius:14px;padding:12px;min-height:60vh;border-top:4px solid var(--c)}
.col.drag{outline:2px dashed #f8fafc;outline-offset:-6px}
.col h2{font-size:17px;margin:4px 6px 12px;display:flex;justify-content:space-between;color:var(--c)}
.col h2 span{background:var(--c);color:#0b0d12;border-radius:999px;padding:1px 9px;font-size:12px;font-weight:700}
.card{background:var(--cardbg);color:#e5e7eb;border:1px solid rgba(255,255,255,.1);border-left:4px solid var(--c);border-radius:10px;padding:10px 12px;margin-bottom:10px;box-shadow:0 4px 12px rgba(0,0,0,.35);cursor:grab}
.card.done .ttl{text-decoration:line-through;color:#9ca3af}
.row{display:flex;align-items:center;gap:8px}
.row input[type=checkbox]{width:18px;height:18px;accent-color:var(--done)}
.ttl{flex:1;font-weight:600;outline:none;border-radius:4px;padding:2px;color:#f3f4f6;font-size:16px}
.ttl:focus,.obs:focus{background:rgba(0,0,0,.3);box-shadow:0 0 0 2px #7ea2cf}
.ver{display:flex;align-items:center;gap:4px;font-size:13px;color:#cbd5e1}
.ver b{background:#252c38;color:var(--c);border:1px solid rgba(255,255,255,.15);border-radius:6px;padding:2px 7px;font-size:12px}
.ver button{padding:2px 7px;font-size:12px;background:#1a1f2a;color:#e5e7eb;border-color:rgba(255,255,255,.15)}
.obs{width:100%;margin-top:8px;background:#272f3b;border:1px solid rgba(255,255,255,.12);border-radius:8px;padding:7px;font:inherit;font-size:15px;resize:vertical;min-height:60px;color:#e5e7eb}
.obs::placeholder{color:#aab3c1}
.meta{display:flex;justify-content:space-between;margin-top:6px;font-size:12px;color:#c3cad5}
.meta button{background:none;border:0;padding:0;color:#f66f73;font-size:11px}
.hist{font-size:12px;color:#cbd5e1;margin-top:4px}
</style></head><body>
<header><h1>Fábrica Agêntica V2<small id="st">salvo automaticamente neste navegador</small></h1>
<button class="pri" onclick="addCard()">+ Novo card</button>
<button onclick="exportar()">Exportar JSON</button>
<button onclick="document.getElementById('imp').click()">Importar JSON</button>
<input id="imp" type="file" accept=".json" hidden onchange="importar(this)">
</header>
<main class="board" id="board"></main>
<script>
const KEY='fabrica-v2-checklist';
const COLS=[['todo','A Fazer','--todo','#141821','#3b4658'],['doing','Em Andamento','--doing','#141821','#3b4658'],['done','Pronto','--done','#141821','#3b4658']];
const INICIAIS=['Setup do repositório','Bot único por feature (dono da feature)','Bot fixo de entrada e limpeza','Grupos/sessões novas por fase','Handoff enxuto','Comunicação com o modelo do Cursor','Comunicação com o humano','Fase research','Fase plan','Fase implement','Fase review','Remoção dos bots orquestradores redundantes'];
const hoje=()=>new Date().toLocaleString('pt-BR');
let store=null;try{store=window.localStorage;store.getItem(KEY)}catch(e){store=null}
function load(){try{return store?JSON.parse(store.getItem(KEY)||'null'):null}catch(e){return null}}
let cards=load()||INICIAIS.map((t,i)=>({id:Date.now()+i,title:t,col:'todo',done:false,obs:'',ver:1,hist:[]}));
const MIG=[{k:'mig-setup-repo-20261113',t:'Setup do repositório',obs:'Repositório criado em 13/11/2026: github.com/Elienaldo/fabrica-agentica-v2 (público), commit inicial ddab017 com push na main.'}];
for(const m of MIG){let feito=false;try{feito=store&&store.getItem(KEY+':'+m.k)}catch(e){}
 if(!feito){const x=cards.find(y=>y.title===m.t);if(x&&x.col!=='done'){x.col='done';x.done=true;x.obs=x.obs?x.obs+'\n'+m.obs:m.obs;x.upd='13/11/2026, 22:38:00'}
 try{if(store){store.setItem(KEY,JSON.stringify(cards));store.setItem(KEY+':'+m.k,'1')}}catch(e){}}}
const ADD=[{k:'add-supervisor-20261113',t:'Supervisor',obs:'Bot fixo. Ponto de entrada único com o humano. Abre chat novo por fase. Delega pros bots de feature.'}];
for(const m of ADD){let feito=false;try{feito=store&&store.getItem(KEY+':'+m.k)}catch(e){}
 if(!feito){if(!cards.some(y=>y.title===m.t))cards.push({id:Date.now()+999,title:m.t,col:'todo',done:false,obs:m.obs,ver:1,hist:[],upd:'13/11/2026, 22:43:00'});
 try{if(store){store.setItem(KEY,JSON.stringify(cards));store.setItem(KEY+':'+m.k,'1')}}catch(e){}}}
{const k=KEY+':top-supervisor-20261113';let feito=false;try{feito=store&&store.getItem(k)}catch(e){}
 if(!feito){const i=cards.findIndex(y=>y.title==='Supervisor');if(i>0){const [x]=cards.splice(i,1);cards.unshift(x)}
 try{if(store){store.setItem(KEY,JSON.stringify(cards));store.setItem(k,'1')}}catch(e){}}}
{const k=KEY+':supervisor-eggbot-20261113';let feito=false;try{feito=store&&store.getItem(k)}catch(e){}
 if(!feito){const x=cards.find(y=>y.title==='Supervisor');if(x){x.hist.push({v:x.ver,em:'13/11/2026, 22:51:00',obs:x.obs});x.ver++;x.title='Supervisor (assumido pelo Dr. Eggbot)';
 x.obs='Decisão de 13/11/2026 (Elienaldo): não haverá Supervisor como bot separado. O Dr. Eggbot assume a função: recebe as demandas do humano e solicita a criação da sessão, do bot responsável pela feature e da feature. Ele passa a ter essa função além de criar bots.';x.upd='13/11/2026, 22:51:00'}
 try{if(store){store.setItem(KEY,JSON.stringify(cards));store.setItem(k,'1')}}catch(e){}}}
{const k=KEY+':eggbot-adapt-20261113';let feito=false;try{feito=store&&store.getItem(k)}catch(e){}
 if(!feito){const x=cards.find(y=>y.title==='Supervisor (assumido pelo Dr. Eggbot)');if(x){x.col='done';x.done=true;x.upd='13/11/2026, 22:52:00'}
 if(!cards.some(y=>y.title==='Adaptação do Dr. Eggbot'))cards.unshift({id:Date.now()+1999,title:'Adaptação do Dr. Eggbot',col:'todo',done:false,obs:'Dr. Eggbot passa a receber demandas do humano, disparar criação de sessão e de feature, e criar o bot único da feature. Função antes prevista para o Supervisor.',ver:1,hist:[],upd:'13/11/2026, 22:52:00'});
 try{if(store){store.setItem(KEY,JSON.stringify(cards));store.setItem(k,'1')}}catch(e){}}}
{const k=KEY+':supervisor-start-bots-20261113';let feito=false;try{feito=store&&store.getItem(k)}catch(e){}
 if(!feito){cards=cards.filter(y=>y.title!=='Adaptação do Dr. Eggbot');
 const x=cards.find(y=>y.title==='Supervisor (assumido pelo Dr. Eggbot)');if(x){x.hist.push({v:x.ver,em:'13/11/2026, 22:54:00',obs:x.obs});x.ver++;x.title='Supervisor (start + criação de bots)';
 x.obs='Decisão de 13/11/2026 (Elienaldo), que substitui a anterior do mesmo dia: o Supervisor assume o start (recebe as demandas do humano e solicita a criação da sessão e da feature) e também a criação de bots, trazendo para dentro dele as skills e funcionalidades do Dr. Eggbot. O Dr. Eggbot fica só para criar bots avulsos quando o Elienaldo pedir, fora do fluxo da fábrica. Mudança em relação à anterior: o start não vai mais para o Dr. Eggbot, e a adaptação dele foi cancelada. Motivo: evitar um bot com duas funções, economizar tokens e deixar o Eggbot livre para uso avulso.';x.col='done';x.done=true;x.upd='13/11/2026, 22:54:00'}
 try{if(store){store.setItem(KEY,JSON.stringify(cards));store.setItem(k,'1')}}catch(e){}}}
{const k=KEY+':adapt-supervisor-20261113';let feito=false;try{feito=store&&store.getItem(k)}catch(e){}
 if(!feito){const o='Decisão de 13/11/2026: o Supervisor assume o start (recebe as demandas do humano e solicita a criação da sessão e da feature) e também a criação de bots, trazendo as skills do Dr. Eggbot. O Dr. Eggbot fica só para criar bots avulsos, fora do fluxo da fábrica.';
 const x=cards.find(y=>y.title==='Adaptação do Dr. Eggbot');
 if(x){x.hist.push({v:x.ver,em:'13/11/2026, 22:55:00',obs:x.obs});x.ver++;x.title='Adaptação do Supervisor';x.obs=o;x.upd='13/11/2026, 22:55:00'}
 else if(!cards.some(y=>y.title==='Adaptação do Supervisor'))cards.unshift({id:Date.now()+2999,title:'Adaptação do Supervisor',col:'todo',done:false,obs:o,ver:2,hist:[{v:1,em:'13/11/2026, 22:52:00',obs:'Adaptação do Dr. Eggbot: Dr. Eggbot passa a receber demandas do humano, disparar criação de sessão e de feature, e criar o bot único da feature. Função antes prevista para o Supervisor.'}],upd:'13/11/2026, 22:55:00'});
 try{if(store){store.setItem(KEY,JSON.stringify(cards));store.setItem(k,'1')}}catch(e){}}}
{const k=KEY+':revisao-bootstrapper-start-20261114';let feito=false;try{feito=store&&store.getItem(k)}catch(e){}
 if(!feito){const o="Conteúdo integral de skills\\bootstrapper-start.md para revisão (14/11/2026):\n\n---\nname: Bootstrapper — start\ndescription: >-\n  Bootstrapper v1 — 13/11/2026. Carregue ao receber uma feature nova do humano: nome da feature, rotina de criação de sessão, verificação de sessão e grupo, encerramento e comunicação com o humano.\n---\n# Bootstrapper — start\n\n**Versão:** Bootstrapper v1 — 13/11/2026 (mesmo rótulo de `markdown\\modelos\\bootstrapper.md` e `skills\\bootstrapper-criacao-arquiteto.md`).\n\nAdaptado de `skills\\supervisor-criacao-secao.md` (seções 18 e 23), `skills\\supervisor-comunicacao-humana.md` (seções 26 e 27), `markdown\\comunicacao.md` (seção 5) e `markdown\\modelos\\dispatcher.md`. As fontes não foram alteradas.\n\n## 1. Receber a solicitação (passo a)\nRegistre o pedido original do humano como veio, sem reinterpretar. Se faltar o que é preciso para nomear a feature, pergunte ao humano (seção 6).\n\n## 2. Nome da feature (passo b)\nPadrão literal da seção 18 de `skills\\supervisor-criacao-secao.md`: \"o prefixo (`feat` ou `fix`), um hífen e o nome da feature em minúsculas com hifens, por exemplo `feat-nome-da-feature` (hífen no lugar da barra, que pode não ser aceita em título de seção)\".\n- Use o nome exato desse pedido. Ninguém acrescenta prefixo nem converte maiúsculas automaticamente (seção 23, item 1, da mesma skill).\n- Esse nome é o mesmo da seção da feature e entra nos nomes dos grupos: `canal-<nome-da-feature>` (grupo inicial) e `<fase>-<nome-da-feature>` (grupos de fase), conforme `markdown\\comunicacao.md`, seção 5.\n- Ponto em aberto herdado de `markdown\\comunicacao.md`, seção 7: o ditado original dizia `fit`; foi gravado `feat`. Confirmação do Elienaldo ainda pendente.\n- Antes de seguir, confira se o nome já existe ativo (seção, grupo ou Arquiteto). Se existir, recuse e avise o humano.\n\n## 3. Rotina de criação de sessão (passo c) — PENDÊNCIA\n**Não existe nas fontes da V2** uma rotina que crie sessão e grupo a partir do nome da feature. O que existe hoje:\n- O script `C:\\Users\\Elienaldo\\GrokBot-Scripts\\criar-secao-feature.py \"<nome-da-feature>\"` (seção 23 de `skills\\supervisor-criacao-secao.md` e `contratos\\contrato-webhook-criacao.md`). Ele cria **só a seção da sidebar**; não cria grupo, não cria bots e não é sessão do Cursor.\n- O grupo inicial `canal-<nome-da-feature>` não é criado por script: nas fontes, era criado à mão pelo bot de coordenação da V1.\n- `contratos\\proposta-rotina-unica-supervisor.md`: ideia de rotina única por webhook aprovada em 11/11/2026, **não implementada**.\n\nEnquanto a rotina não existir: não dispare nada por outro meio, não crie rotina, listener nem webhook por conta própria; avise o humano (seção 6) que o passo (c) está bloqueado e pare. Quando a rotina for criada, este item recebe o nome e a forma de chamada reais, com nova versão no modelo e nas skills juntos.\n\nRegras que já valem para qualquer disparo: um disparo por pedido; registre pedido, nome e estado antes de disparar; sem retry automático após erro, timeout ou falha de aviso; uma notificação final nunca é novo start; estado incerto exige conciliação e aviso ao humano, nunca relançamento.\n\n## 4. Verificar sessão e grupo (passo d)\n- Confirme pela ferramenta sancionada do app que a seção da feature existe com o nome exato e sem ambiguidade (ListSections).\n- Confirme que o grupo `canal-<nome-da-feature>` existe, com o nome exato. **PENDÊNCIA:** a composição de membros do grupo na V2 não está definida (na V1 eram o bot de coordenação e o humano solicitante).\n- Sem as duas confirmações, ou com nome divergente, duplicado ou de outra feature, não siga para o passo (e): registre e avise o humano.\n\n## 5. Encerrar (passo f)\nAo receber o ID do Arquiteto criado (`bootstrapper-criacao-arquiteto`), avise o humano em uma mensagem curta: nome da feature, seção e grupo confirmados, nome e ID do Arquiteto. Depois disso, o Bootstrapper não acompanha a feature: fica pronto para a próxima demanda.\n\n## 6. Comunicação com o humano\n- Linguagem comum, sem jargão, para pessoa não técnica.\n- Fluxo dependendo de decisão humana ou parado: aviso no mesmo turno com estado atual em uma frase, o que entendeu da última resposta e as opções, sempre com resposta livre. Se já houver widget aguardando o humano, não abra outro.\n- Ao apresentar consequência relevante, diga o que acontece se aprovar e se negar.\n- Widget sempre com `allowCustom: true`; nunca um botão fictício \"Outro\".\n- Esta regra não cria aprovação redundante nem amplia autorizações.\n";
 if(!cards.some(y=>y.title==='Revisão Bootstrapper Start'))cards.unshift({id:Date.now()+3999,title:'Revisão Bootstrapper Start',col:'todo',done:false,obs:o,ver:1,hist:[],upd:'14/11/2026, 00:13:00'});
 try{if(store){store.setItem(KEY,JSON.stringify(cards));store.setItem(k,'1')}}catch(e){}}}
const save=()=>{try{if(store)store.setItem(KEY,JSON.stringify(cards))}catch(e){}};
const esc=s=>s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function render(){const b=document.getElementById('board');b.innerHTML='';
 for(const[k,n,v,bg,cbg]of COLS){const c=document.createElement('section');c.className='col';c.style.setProperty('--c',`var(${v})`);c.style.setProperty('--colbg',bg);c.style.setProperty('--cardbg',cbg);
  const list=cards.filter(x=>x.col===k);c.innerHTML=`<h2>${n}<span>${list.length}</span></h2>`;
  c.ondragover=e=>{e.preventDefault();c.classList.add('drag')};c.ondragleave=()=>c.classList.remove('drag');
  c.ondrop=e=>{e.preventDefault();const id=+e.dataTransfer.getData('id');const x=cards.find(y=>y.id===id);if(x){x.col=k;x.done=k==='done';save();render()}};
  for(const x of list){const d=document.createElement('div');d.className='card'+(x.done?' done':'');d.draggable=true;d.style.setProperty('--c',`var(${v})`);
   d.ondragstart=e=>e.dataTransfer.setData('id',x.id);
   d.innerHTML=`<div class="row"><input type="checkbox" ${x.done?'checked':''}><div class="ttl" contenteditable>${esc(x.title)}</div>
   <div class="ver"><b>v${x.ver}</b><button title="Nova versão">+</button></div></div>
   <textarea class="obs" placeholder="Observação: o que aconteceu...">${esc(x.obs)}</textarea>
   ${x.hist.length?`<div class="hist">${x.hist.slice(-3).map(h=>'v'+h.v+' · '+h.em).join(' — ')}</div>`:''}
   <div class="meta"><span>${x.upd?'atualizado '+x.upd:''}</span><button>remover</button></div>`;
   const [cb]=d.querySelectorAll('input');cb.onchange=()=>{x.done=cb.checked;x.col=cb.checked?'done':(x.col==='done'?'doing':x.col);x.upd=hoje();save();render()};
   const t=d.querySelector('.ttl');t.onblur=()=>{x.title=t.textContent.trim()||x.title;x.upd=hoje();save()};
   const o=d.querySelector('.obs');o.oninput=()=>{x.obs=o.value;x.upd=hoje();save()};
   d.querySelector('.ver button').onclick=()=>{x.hist.push({v:x.ver,em:hoje(),obs:x.obs});x.ver++;x.upd=hoje();save();render()};
   d.querySelector('.meta button').onclick=()=>{if(confirm('Remover este card?')){cards=cards.filter(y=>y!==x);save();render()}};
   c.appendChild(d)}
  b.appendChild(c)}}
function addCard(){const t=prompt('Título do card:');if(!t)return;cards.push({id:Date.now(),title:t,col:'todo',done:false,obs:'',ver:1,hist:[]});save();render()}
function exportar(){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(cards,null,2)],{type:'application/json'}));a.download='checklist-v2-'+new Date().toISOString().slice(0,10)+'.json';a.click()}
function importar(i){const f=i.files[0];if(!f)return;f.text().then(s=>{cards=JSON.parse(s);save();render()})}
try{render()}catch(e){document.getElementById('board').innerHTML='<p style="padding:20px;color:#f87171">Erro ao montar o painel: '+e.message+'</p>'}
if(!store)document.getElementById('st').textContent='aviso: este visualizador bloqueia o salvamento; abra no Chrome e use Exportar JSON';
</script><noscript><p style="padding:24px">Este painel precisa de JavaScript. Abra o arquivo no Chrome.</p></noscript></body></html>
